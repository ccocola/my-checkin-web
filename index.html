<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日打卡表 & 购买台账</title>
<style>
:root{
--bg:#f3f4f2; --card:#ffffff; --line:#d9dcd7; --line-strong:#b9bdb5;
--text:#23281f; --muted:#7a8076; --accent:#2f6f5f; --accent-soft:#e6f0ec;
--pink:#fbeaea; --gray:#dfe1dc; --diff:#fdece3; --diff-line:#e08a5a;
--yellow-bg:#fff3cd;
--danger-bg:#ffebee; --danger-text:#e53935;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
font-size:15px;line-height:1.5;}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
header.top h1{font-size:20px;margin:0;font-weight:700;}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px;}
.btn{border:1px solid var(--line-strong);background:#fff;color:var(--text);border-radius:8px;
padding:7px 12px;font-size:14px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;justify-content:center;}
.btn:hover{background:#f6f7f5;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#275f51;}
.btn.small{padding:4px 9px;font-size:13px;min-height:30px;}
.btn.danger{border-color:#d9a0a0;color:#b24747;background:#fff;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

nav.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 12px;font-size:15px;border-radius:9px;cursor:pointer;color:var(--muted);}
nav.tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.meta-row .date{font-weight:600;font-size:16px;}
.progress{color:var(--muted);font-size:14px;}
.progress b{color:var(--accent);}

.sub-nav{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.sub-nav .btn{background:#f8f9f8;border-color:var(--line);}
.sub-nav .btn:hover{background:#fff;border-color:var(--line-strong);}

.table-scroll{overflow-x:auto;}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed;min-width:520px;}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle;}
table.grid thead th{background:#f7f8f6;font-weight:600;font-size:14px;}
table.grid th.col-label,table.grid td.label{text-align:left;}
table.grid td.label{font-weight:500;}
tr.group td{background:#f0f2ee;font-weight:700;text-align:left;}
td.tint-pink{background:var(--pink);}
td.tint-gray{background:var(--gray);}
th.tint-pink{background:var(--pink);}
th.tint-gray{background:var(--gray);}
.cell-target{color:var(--text);font-weight:600;}
.empty{color:var(--line-strong);}

.check{width:34px;height:34px;margin:0 auto;border:1.5px solid var(--line-strong);border-radius:7px;
background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--accent);}
.check.on{background:var(--accent-soft);border-color:var(--accent);}
.check:hover{border-color:var(--accent);}
td.clickable{cursor:pointer;}

.compare-wrap{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:16px;}
@media (max-width:820px){.compare-wrap{grid-template-columns:1fr;}}
.compare-col h3{font-size:14px;margin:0 0 8px;color:var(--muted);}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--accent);margin-bottom:12px;}

.editor-section{margin-bottom:20px;}
.editor-section h2{font-size:15px;margin:0 0 10px;}
.col-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.col-card{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.col-card .row-line{display:flex;gap:8px;align-items:center;}
input[type=text],select{border:1px solid var(--line-strong);border-radius:7px;padding:7px 9px;font-size:14px;width:100%;background:#fff;}
.group-block{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
.group-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.group-head input{max-width:160px;font-weight:600;}
.edit-table{width:100%;border-collapse:collapse;}
.edit-table th,.edit-table td{border:1px solid var(--line);padding:6px;text-align:center;}
.edit-table td.label input{text-align:left;}
.edit-table input[type=text]{font-size:13px;}
.edit-table .num{width:74px;}
.switch{display:inline-flex;align-items:center;justify-content:center;}
.muted{color:var(--muted);font-size:13px;}
.save-bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ====== 购买台账定制样式 ====== */
.ledger-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr)); 
    gap:8px;
    width:100%;
}
.ledger-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 6px;
    background:#fff;
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
}
.ledger-head{background:#ffd966;text-align:center;font-weight:bold;padding:6px 2px;border-radius:6px;margin-bottom:10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ledger-meta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:0 4px;}
.ledger-meta input{border:none;border-bottom:1px solid var(--line-strong);width:44px;text-align:center;background:transparent;padding:2px;font-size:12px;}

.ledger-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.ledger-table th,.ledger-table td{border:1px solid var(--line);padding:2px 1px;text-align:center;height:26px;word-break:break-all;}
.ledger-table input{border:none;background:transparent;width:100%;min-width:0;text-align:center;padding:0;font-size:12px;}
.ledger-table input:focus{outline:1px solid var(--accent);background:#fff;}

.countdown-warning { color: var(--danger-text) !important; font-weight: bold; background-color: var(--danger-bg) !important; }
.sum-row { background: #f0f2ee; font-weight: bold; font-size: 12px; }
.sum-row td { padding: 4px 2px !important; }

.history-block {
    background-color: #f4f5f4;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 6px;
    margin-top: 12px;
    opacity: 0.85;
}
.history-block .ledger-table th, 
.history-block .ledger-table td { border-color: #e0e2df; }
.history-block .ledger-table input { color: #777; }

/* 黄色高亮行 */
.bg-yellow{background:var(--yellow-bg) !important;}

/* 常购商品库 */
.goods-table{width:100%;border-collapse:collapse;}
.goods-table th,.goods-table td{border:1px solid var(--line);padding:6px;text-align:center;}
.goods-table input{border:none;background:transparent;width:100%;text-align:center;padding:4px;}
.goods-table input[data-f="name"]{text-align:left;}
.goods-table input:focus{outline:1px solid var(--accent);background:#fff;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#23281f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
.toast.show{opacity:1;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<h1>每日打卡表 & 台账</h1>
<div class="sub">母版改动只影响之后新生成的日子；每天打开自动按母版生成当日子份，只保留最近 3份对比。</div>
</div>

<button class="btn small" id="btn-export">导出备份</button>

</div>
</header>  

<nav class="tabs">
<button data-view="today" class="active">今日打卡</button>
<button data-view="ledger">账号购买台账</button>
</nav>  
<main id="main"></main>
</div>

function applyScreenshotDefaults(m){
const col = n => m.columns.find(c=>c.name===n);

return grp.rows.find(r=>r.label===label);
};
const setCells=(r,arr)=>{arr.forEach(k=>{r.cells[C[k].id]=1;});};
const setTarget=(r,k,v)=>{r.targets[C[k].id]=v;};

setCells(row('TB','猫超'),     ['b','c','d','e']);
setCells(row('TB','签到'),     ['c','d','e','f']);
setCells(row('TB','签到元宝'), ['b','c','d','e','f']);
setCells(row('TB','成就'),     ['d','e','f']);
setTarget(row('TB','芭芭超值'),'d','20'); setTarget(row('TB','芭芭超值'),'e','20');

setTarget(jdHead,'d','101'); setTarget(jdHead,'f','9');

setCells(row('JD','水'),     ['b','c','d','f']);

setCells(row('JD','家居馆'), ['b','c','d','f']);
setCells(row('JD','省钱卡'), ['b','c']);

setCells(row('电网','电网'), ['b']);
return m;
}

/* ==================== 工具 ==================== */
const STORE_KEY='checkin-tracker-v2'; 
function uid(){return Math.random().toString(36).slice(2,9);}
function deep(o){return JSON.parse(JSON.stringify(o));}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');
return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtDate(s){const [y,m,d]=s.split('-');return `${y}/${m}/${d}`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function getDiffDays(dateStr1, dateStr2) {
    const d1 = new Date(dateStr1);
    const d2 = new Date(dateStr2);
    const diff = Math.abs(d2.getTime() - d1.getTime());
    return Math.floor(diff / (1000 * 60 * 60 * 24));
}

/* ==================== 状态 ==================== */
let state = load();
let draft = null; 
let currentView='today'; 

function load(){
try{
const raw=localStorage.getItem(STORE_KEY);
if(raw){
    const s=JSON.parse(raw);
    if(s&&s.master){
        if(!s.ledgers) s.ledgers = {};
        if(!s.goods) s.goods = defaultGoodsLibrary();
        return s;
    }
}
}catch(e){}
const master=applyScreenshotDefaults(defaultMaster());
const initialLedgers = getDefaultLedgers();

                { day: '59', countdown: '', minCost: '20', product: '白雪', actual: '23.42' }
            ]
        }]
    };
}

function save(){localStorage.setItem(STORE_KEY, JSON.stringify(state));}

function ensureToday(){
const t=todayStr();
if(!state.days[t]){
state.days[t]={master:deep(state.master), checks:{}, createdAt:Date.now()};
}
pruneDays();
save();
}
function pruneDays(){
const keys=Object.keys(state.days).sort().reverse();
keys.slice(3).forEach(k=>delete state.days[k]);
}
function todayDay(){ensureToday();return state.days[todayStr()];}

function totalChecks(m){
let n=0;
m.groups.forEach(g=>g.rows.forEach(r=>{n+=Object.keys(r.cells).length;}));
return n;
}
function doneChecks(day){
return Object.values(day.checks).filter(Boolean).length;
}

/* ==================== 渲染：账号购买台账 ==================== */
function renderLedger() {
    let html = `<div class="card">
    <div class="meta-row">
        <div class="date">账号购买台账</div>
    </div>
    <div class="sub-nav">
        <button class="btn nav-to-sub" data-target="master">打开母版模板</button>
        <button class="btn nav-to-sub" data-target="goods">常购商品库</button>
        <button class="btn nav-to-sub" data-target="compare">查看最近3天打卡</button>
    </div>
    <div class="ledger-grid">`;

    // 台账里不显示本5，过滤掉
    const ledgerCols = state.master.columns
        .filter(c => c.name !== '本5')
        .sort((a, b) => {
            const matchA = a.name.match(/\d+/);
            const matchB = b.name.match(/\d+/);
            let numA = matchA ? parseInt(matchA[0]) : 99;
            let numB = matchB ? parseInt(matchB[0]) : 99;
            if (numA === 99) {
                if (a.name.includes('二乔')) numA = 6;
                if (a.name.includes('爱')) numA = 7;
                if (a.name.includes('罗')) numA = 8;
                if (a.name.includes('康')) numA = 9;
            }
            if (numB === 99) {
                if (b.name.includes('二乔')) numB = 6;
                if (b.name.includes('爱')) numB = 7;
                if (b.name.includes('罗')) numB = 8;
                if (b.name.includes('康')) numB = 9;
            }
            return numA - numB;
        });

    ledgerCols.forEach(col => {
        if(!state.ledgers[col.name]) {
            state.ledgers[col.name] = [{ roundId: Date.now(), rows: [], startDate: '', currentDay: '' }];
        }
        const rounds = state.ledgers[col.name];

        let colTitle = col.name;
        if(!/\d/.test(colTitle)) {
            if(colTitle.includes('二乔')) colTitle = '6 | ' + colTitle;
            else if(colTitle.includes('爱')) colTitle = '7 | ' + colTitle;
            else if(colTitle.includes('罗')) colTitle = '8 | ' + colTitle;
            else if(colTitle.includes('康')) colTitle = '9 | ' + colTitle;
        }

        html += `<div class="ledger-card">
            <div class="ledger-head" title="${esc(col.name)}">${esc(colTitle)}</div>`;
            
        rounds.forEach((round, roundIdx) => {
            const isNewest = roundIdx === 0;
            
            let currentDayNum = '';
            if (round.startDate) {
                const match = round.startDate.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
                if (match) {
                    const m = parseInt(match[1]) - 1;
                    const d = parseInt(match[2]);
                    const today = new Date();
                    let year = today.getFullYear();
                    if (m > today.getMonth()) year--; 
                    const start = new Date(year, m, d);
                    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                    currentDayNum = diff >= 0 ? diff + 1 : 1;
                }
            }

            if (isNewest) {
                html += `<div class="ledger-meta">
                    <span>开启：<input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-f="startDate" value="${esc(round.startDate||'')}" placeholder="08/27"></span>
                    <span>天数：<b>${currentDayNum || '-'}</b></span>
                </div>`;
            } else {
                html += `<div class="history-block">`;
            }

            // 缩窄限制，放大商品名
            html += `<table class="ledger-table">
                <thead><tr>
                    <th style="width:12%">天数</th><th style="width:8%">限</th><th style="width:10%">低消</th><th style="width:47%">商品</th><th style="width:23%">实付</th>
                </tr></thead>
                <tbody>`;

            const rows = round.rows;
            const totalRows = Math.max(20, rows.length);
            let sumActual = 0;

            for(let i=0; i<totalRows; i++) {
                const r = rows[i] || { day:'', countdown:'', countdownDate:'', minCost:'', product:'', actual:'' };
                const bgClass = r.isAchievement ? 'bg-yellow' : '';
                
                let displayCountdown = r.countdown;
                if (r.countdown !== '' && r.countdownDate) {
                    const diff = getDiffDays(r.countdownDate, todayStr());
                    if (diff > 0) {
                        displayCountdown = Number(r.countdown) - diff;
                    }
                }
                
                let countdownClass = '';
                if (displayCountdown !== '' && Number(displayCountdown) <= 1 && Number(displayCountdown) >= 0) {
                    countdownClass = 'countdown-warning';
                }

                if (r.actual && !isNaN(parseFloat(r.actual))) {
                    sumActual += parseFloat(r.actual);
                }

                html += `<tr class="${bgClass}" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" title="双击整行切换成就高亮">
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="day" value="${esc(r.day)}"></td>
                    <td><input type="text" class="${countdownClass}" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="countdown" value="${esc(displayCountdown)}" title="${r.countdownDate?'上次更新: '+r.countdownDate:''}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="minCost" value="${esc(r.minCost)}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="product" value="${esc(r.product)}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="actual" value="${esc(r.actual)}"></td>
                </tr>`;
            }

            html += `</tbody><tfoot>
                <tr class="sum-row">
                    <td colspan="4" style="text-align:right; padding-right:6px;">合计：</td>
                    <td style="color:#e53935;" class="sum-amount">${sumActual.toFixed(2)}</td>
                </tr>
            </tfoot></table>`;

            if (isNewest) {
                html += `<div style="margin-top:12px; text-align:center;">
                    <button class="btn small primary" data-new-round="${col.name}">结束本轮（生成新空白）</button>
                </div>`;
            } else {
                html += `</div>`;
            }
        });
        html += `</div>`;
    });

    html += `</div></div>`;
    document.getElementById('main').innerHTML = html;
    bindLedgerEvents();
}

function bindLedgerEvents() {
    document.querySelectorAll('.ledger-card input').forEach(input => {
        input.addEventListener('input', (e) => {
            const accName = e.target.dataset.acc;
            const roundId = e.target.dataset.round;
            const rowIdx = e.target.dataset.row;
            const field = e.target.dataset.f;
            const val = e.target.value;

            if (!rowIdx && field === 'startDate') {
                const round = state.ledgers[accName].find(r => r.roundId == roundId);
                if (round) round[field] = val;
            } else if (rowIdx !== undefined) {
                const round = state.ledgers[accName].find(r => r.roundId == roundId);
                if (round) {
                    if (!round.rows[rowIdx]) round.rows[rowIdx] = {};
                    
                    if (field === 'countdown') {
                        round.rows[rowIdx].countdown = val;
                        round.rows[rowIdx].countdownDate = todayStr(); 
                    } else {
                        round.rows[rowIdx][field] = val;
                    }
                }
            }
            save();

            if (field === 'actual') {
                const table = e.target.closest('table');
                let sum = 0;
                table.querySelectorAll('input[data-f="actual"]').forEach(inp => {
                    const num = parseFloat(inp.value);
                    if (!isNaN(num)) sum += num;
                });
                const sumCell = table.querySelector('.sum-amount');
                if (sumCell) sumCell.textContent = sum.toFixed(2);
            }
        });
        
        if (input.dataset.f === 'startDate') {
            input.addEventListener('change', () => renderLedger());
        }
    });

    document.querySelectorAll('.ledger-table tbody tr').forEach(tr => {
        tr.addEventListener('dblclick', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            const accName = tr.dataset.acc;
            const roundId = tr.dataset.round;
            const rowIdx = tr.dataset.row;
            const round = state.ledgers[accName].find(r => r.roundId == roundId);
            if (round) {
                if (!round.rows[rowIdx]) round.rows[rowIdx] = {};
                round.rows[rowIdx].isAchievement = !round.rows[rowIdx].isAchievement;
                save();
                renderLedger();
            }
        });
    });

    document.querySelectorAll('[data-new-round]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const accName = e.target.dataset.newRound;
            if (confirm('确定结束本轮吗？完成后将在上方生成新一轮留白。')) {
                state.ledgers[accName].unshift({
                    roundId: Date.now(),
                    rows: [],
                    startDate: '',
                    currentDay: ''
                });
                save();
                renderLedger();
            }
        });
    });
}

/* ==================== 渲染：常购商品库 ==================== */
function syncLedgerToGoods() {
    let summary = {}; 
    Object.keys(state.ledgers).forEach(accName => {
        summary[accName] = {};
        state.ledgers[accName].forEach(round => {
            round.rows.forEach(r => {
                if (r.product && r.actual) {
                    const num = parseFloat(r.actual);
                    if (!isNaN(num)) {
                        if (!summary[accName][r.product]) summary[accName][r.product] = [];
                        summary[accName][r.product].push(r.actual);
                    }
                }
            });
        });
    });

    const targetGoods = new Set();
    Object.keys(summary).forEach(accName => {
        Object.keys(summary[accName]).forEach(prodName => {
            if (summary[accName][prodName].length >= 2) {
                targetGoods.add(prodName);
            }
        });
    });

    targetGoods.forEach(prodName => {
        if (!state.goods.find(g => g.name === prodName)) {
            state.goods.push({ id: uid(), name: prodName, minCost: '', prices: {} });
        }
    });

    Object.keys(summary).forEach(accName => {
        const col = state.master.columns.find(c => c.name === accName);
        if (!col) return;
        Object.keys(summary[accName]).forEach(prodName => {
            const amounts = summary[accName][prodName];
            if (amounts.length >= 2) {
                const good = state.goods.find(g => g.name === prodName);
                if (good) {
                    good.prices[col.id] = amounts.join(' / ');
                }
            }
        });
    });
}

    syncLedgerToGoods(); 

    let html = `<div class="card">

        <div class="table-scroll">

    // 这里按 5/6/7/8/9 排序常购库
    const goodsCols = [...state.master.columns].sort((a, b) => {

            if(name.includes('本') || name.includes('5')) return 5;

    goodsCols.forEach(c => {
        html += `<th>${esc(c.name)}</th>`;

    html += `<th style="width:8%">操作</th></tr></thead><tbody>`;

    state.goods.forEach(g => {
        html += `<tr>
            <td><input type="text" data-goods="${g.id}" data-f="name" value="${esc(g.name)}"></td>
            <td><input type="text" data-goods="${g.id}" data-f="minCost" value="${esc(g.minCost)}"></td>`;

            const val = g.prices[c.id] || '';

        });
        html += `<td><button class="btn small danger" data-del-goods="${g.id}">删</button></td>
        </tr>`;
    });

    html += `</tbody></table></div>
        <div style="margin-top:14px;"><button class="btn small" data-add-goods>＋ 添加商品</button></div>
    </div>`;
    document.getElementById('main').innerHTML = html;

    document.querySelectorAll('.goods-table input').forEach(input => {
        input.addEventListener('input', (e) => {
            const id = e.target.dataset.goods;
            const field = e.target.dataset.f;
            const colId = e.target.dataset.colid;
            const val = e.target.value;
            const item = state.goods.find(g => g.id === id);
            if (item) {
                if (field === 'price') {
                    item.prices[colId] = val;
                } else {
                    item[field] = val;
                }
            }
            save();
        });
    });

    document.querySelectorAll('[data-del-goods]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const id = e.target.dataset.delGoods;
            state.goods = state.goods.filter(g => g.id !== id);
            save();
            renderGoods();
        });
    });

    document.querySelector('[data-add-goods]').addEventListener('click', () => {
        state.goods.push({ id: uid(), name: '新商品', minCost: '', prices: {} });
        save();
        renderGoods();
    });
}

});
document.querySelectorAll('[data-row]').forEach(el=>{
el.addEventListener('input',()=>{draft.groups[+el.dataset.row].rows[+el.dataset.ri].label=el.value;});
});
document.querySelectorAll('[data-cell]').forEach(el=>{
el.addEventListener('change',()=>{
const g=draft.groups[+el.dataset.cell],r=g.rows[+el.dataset.ri],c=draft.columns[+el.dataset.ci];
if(el.checked) r.cells[c.id]=1; else delete r.cells[c.id];
});
});
document.querySelectorAll('[data-target]').forEach(el=>{
el.addEventListener('input',()=>{
const g=draft.groups[+el.dataset.target],r=g.rows[+el.dataset.ri],c=draft.columns[+el.dataset.ci];
const v=el.value.trim();
if(v) r.targets[c.id]=v; else delete r.targets[c.id];
});
});
document.querySelector('[data-add-col]').addEventListener('click',()=>{
draft.columns.push({id:uid(),name:'新账号',tint:''});
renderMaster();
});
document.querySelectorAll('[data-del-col]').forEach(b=>b.addEventListener('click',()=>{
const ci=+b.dataset.delCol;const cid=draft.columns[ci].id;
draft.columns.splice(ci,1);
draft.groups.forEach(g=>g.rows.forEach(r=>{delete r.cells[cid];delete r.targets[cid];}));
renderMaster();
}));
document.querySelectorAll('[data-add-row]').forEach(b=>b.addEventListener('click',()=>{
draft.groups[+b.dataset.addRow].rows.push({id:uid(),label:'新活动',targets:{},cells:{}});
renderMaster();
}));
document.querySelectorAll('[data-del-group]').forEach(b=>b.addEventListener('click',()=>{
if(!confirm('删除该分组及其活动项？'))return;
draft.groups.splice(+b.dataset.delGroup,1);renderMaster();
}));
document.querySelector('[data-revert-draft]').addEventListener('click',()=>{draft=null;renderMaster();});
document.querySelector('[data-save-master]').addEventListener('click',saveMaster);
}

function saveMaster(){
if(draft.groups.length===0){toast('至少保留一个分组');return;}
draft.groups.forEach(g=>g.rows.forEach(r=>{
Object.keys(r.cells).forEach(k=>{if(!draft.columns.find(c=>c.id===k))delete r.cells[k];});
Object.keys(r.targets).forEach(k=>{if(!draft.columns.find(c=>c.id===k))delete r.targets[k];});
}));
state.master=deep(draft);
const t=todayStr();
if(state.days[t] && doneChecks(state.days[t])===0){
state.days[t]={master:deep(state.master),checks:{},createdAt:Date.now()};
toast('母版已保存，今日份已同步为新母版');
}else{
toast('母版已保存；今日已有勾选，保留旧版，明天起按新母版生成');
}
pruneDays();save();draft=null;renderMaster();
}

/* ==================== 备份 ==================== */
function exportBackup(){
const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download=`打卡表备份-${todayStr()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importBackup(file){
const reader=new FileReader();
reader.onload=()=>{
try{
const s=JSON.parse(reader.result);
if(!s||!s.master)throw new Error('bad');
state=s;pruneDays();save();draft=null;ensureToday();render();
toast('备份已导入');
}catch(e){toast('文件不是有效的备份');}
};
reader.readAsText(file);
}

/* ==================== 入口与路由 ==================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function render(){
    ensureToday();
    
    document.querySelectorAll('nav.tabs button').forEach(x => x.classList.remove('active'));
    let activeTab = 'today';
    if (currentView === 'ledger') {
        activeTab = 'ledger';
    } else if (['master', 'goods', 'compare'].includes(currentView)) {
        activeTab = 'today'; 
    }
    const tabBtn = document.querySelector(`nav.tabs button[data-view="${activeTab}"]`);
    if(tabBtn) tabBtn.classList.add('active');

    if(currentView === 'today') renderToday();
    else if(currentView === 'ledger') renderLedger();
    else if(currentView === 'master') renderMaster();
    else if(currentView === 'goods') renderGoods();
    else if(currentView === 'compare') renderCompare();
}

document.querySelectorAll('nav.tabs button').forEach(b => {
    b.addEventListener('click', () => {
        currentView = b.dataset.view;
        render();
    });
});

document.getElementById('main').addEventListener('click', e => {
    const subNavBtn = e.target.closest('.nav-to-sub');
    if (subNavBtn) {
        currentView = subNavBtn.dataset.target;
        render();
        return;
    }
    if (e.target.closest('.back-to-today')) {
        currentView = 'today';
        render();
        return;
    }
});

document.getElementById('btn-export').addEventListener('click',exportBackup);
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change',e=>{
if(e.target.files[0])importBackup(e.target.files[0]);e.target.value='';
});

render();
</script></body>
</html>
