<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周末打卡表 (手机版)</title>
<style>
:root{
--bg:#f3f4f2; --card:#ffffff; --line:#d9dcd7; --line-strong:#b9bdb5;
--text:#23281f; --muted:#7a8076; --accent:#2f6f5f; --accent-soft:#e6f0ec;
--pink:#fbeaea; --gray:#dfe1dc;
--yellow-bg:#fff3cd;
--danger-bg:#ffebee; --danger-text:#e53935;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
font-size:15px;line-height:1.5;}
.wrap{max-width:800px;margin:0 auto;padding:12px 10px 60px;}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
header.top h1{font-size:18px;margin:0;font-weight:700;}
header.top .sub{color:var(--muted);font-size:12px;margin-top:2px;}
.btn{border:1px solid var(--line-strong);background:#fff;color:var(--text);border-radius:8px;
padding:6px 10px;font-size:13px;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;justify-content:center;}
.btn:hover{background:#f6f7f5;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.small{padding:4px 8px;font-size:12px;min-height:28px;}
.btn.danger{border-color:#d9a0a0;color:#b24747;background:#fff;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

nav.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 12px;font-size:15px;border-radius:9px;cursor:pointer;color:var(--muted);}
nav.tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:20px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.meta-row .date{font-weight:600;font-size:16px;}
.progress{color:var(--muted);font-size:13px;}
.progress b{color:var(--accent);}

.sub-nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.sub-nav .btn{background:#f8f9f8;border-color:var(--line);}

.table-scroll{overflow-x:auto;}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed;min-width:400px;}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 2px;text-align:center;vertical-align:middle;font-size:12px;}
table.grid thead th{background:#f7f8f6;font-weight:600;font-size:12px;}
table.grid th.col-label,table.grid td.label{text-align:left;padding-left:6px;}
table.grid td.label{font-weight:500;font-size:13px;}
tr.group td{background:#f0f2ee;font-weight:700;text-align:left;}
td.tint-pink{background:var(--pink);}
td.tint-gray{background:var(--gray);}
th.tint-pink{background:var(--pink);}
th.tint-gray{background:var(--gray);}
.cell-target{color:var(--text);font-weight:600;}
.empty{color:var(--line-strong);}

.check{width:28px;height:28px;margin:0 auto;border:1.5px solid var(--line-strong);border-radius:6px;
background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--accent);}
.check.on{background:var(--accent-soft);border-color:var(--accent);}
td.clickable{cursor:pointer;}

.compare-wrap{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px;}
.compare-col h3{font-size:14px;margin:0 0 8px;color:var(--muted);}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--accent);margin-bottom:12px;}

/* 母版编辑 */
.editor-section{margin-bottom:20px;}
.editor-section h2{font-size:15px;margin:0 0 10px;}
.col-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.col-card{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.col-card .row-line{display:flex;gap:8px;align-items:center;}
input[type=text],select{border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;font-size:13px;width:100%;background:#fff;}
.group-block{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;overflow-x:auto;}
.group-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.group-head input{max-width:120px;font-weight:600;}
.edit-table{width:100%;border-collapse:collapse;min-width:400px;}
.edit-table th,.edit-table td{border:1px solid var(--line);padding:4px;text-align:center;font-size:12px;}
.edit-table td.label input{text-align:left;}
.edit-table .num{width:50px;}
.switch{display:inline-flex;align-items:center;justify-content:center;}
.muted{color:var(--muted);font-size:12px;}
.save-bar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ====== 购买台账 (手机横滑修复版) ====== */
.ledger-scroll-container {
    overflow-x: auto;
    display: flex;
    gap: 12px;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
    align-items: flex-start;
}
/* 固定宽度，保证表格能撑开且不折行 */
.ledger-card{
    width: 85vw; /* 屏幕宽度的85% */
    max-width: 320px;
    flex: 0 0 auto;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    background:#fff;
}
.ledger-head{background:#ffd966;text-align:center;font-weight:bold;padding:6px;border-radius:6px;margin-bottom:10px;font-size:14px;color:#333;}
.ledger-meta{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.ledger-meta input{border:none;border-bottom:1px solid var(--line-strong);width:50px;text-align:center;background:transparent;padding:2px;font-size:12px;}

.ledger-table{width:100%;border-collapse:collapse;font-size:12px;}
.ledger-table th{
    background: #f7f8f6; 
    font-weight: normal; 
    color: #666; 
    padding: 6px 2px;
    border: 1px solid var(--line);
}
.ledger-table td{border:1px solid var(--line);padding:2px 1px;text-align:center;}
/* 强制输入框高度，避免手机端变扁消失 */
.ledger-table input{
    border:none;
    background:transparent;
    width:100%;
    height: 28px; 
    text-align:center;
    padding:0;
    font-size:13px;
    color: inherit;
}
.ledger-table input:focus{outline:1px solid var(--accent);background:#fff;}

.countdown-warning { color: var(--danger-text) !important; font-weight: bold; background-color: var(--danger-bg) !important; }
.sum-row { background: #f0f2ee; font-weight: bold; font-size: 13px; }
.sum-row td { padding: 8px 2px !important; }

.history-block {
    background-color: #f4f5f4;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 6px;
    margin-top: 12px;
    opacity: 0.85;
}
.history-block .ledger-table th, 
.history-block .ledger-table td { border-color: #e0e2df; }
.history-block .ledger-table input { color: #777; }

.bg-yellow{background:var(--yellow-bg) !important;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#23281f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
.toast.show{opacity:1;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<div>
<h1>周末打卡表</h1>
</div>
<div class="toolbar">
<button class="btn small" id="btn-export">导出备份</button>
<button class="btn small" id="btn-import">导入备份</button>
<input type="file" id="import-file" accept="application/json" class="hidden">
</div>
</header>  

<nav class="tabs">
<button data-view="today" class="active">今日打卡</button>
<button data-view="ledger">账号购买台账</button>
</nav>  
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==================== 数据默认值 ==================== */
function defaultMaster(){
return {
columns:[
{id:uid(), name:'本5',    tint:''},
{id:uid(), name:'罗8',    tint:'pink'},
{id:uid(), name:'二乔6',  tint:''},
{id:uid(), name:'7爱101', tint:'gray'},
{id:uid(), name:'康9',    tint:'gray'}
],
groups:[
{id:uid(), name:'TB', rows:[
{id:uid(), label:'猫超',     targets:{}, cells:{}},
{id:uid(), label:'签到',     targets:{}, cells:{}},
{id:uid(), label:'签到元宝', targets:{}, cells:{}},
{id:uid(), label:'成就',     targets:{}, cells:{}},
{id:uid(), label:'芭芭超值', targets:{}, cells:{}}
]},
{id:uid(), name:'JD', rows:[
{id:uid(), label:'', header:true, targets:{}, cells:{}},
{id:uid(), label:'打卡',   targets:{}, cells:{}},
{id:uid(), label:'水',     targets:{}, cells:{}},
{id:uid(), label:'视频卡', targets:{}, cells:{}},
{id:uid(), label:'家居馆', targets:{}, cells:{}},
{id:uid(), label:'省钱卡', targets:{}, cells:{}}
]},
{id:uid(), name:'电网', rows:[
{id:uid(), label:'电网', targets:{}, cells:{}}
]}
]
};
}

function applyScreenshotDefaults(m){
const col = n => m.columns.find(c=>c.name===n);
const C = {b:col('本5'), c:col('罗8'), d:col('二乔6'), e:col('7爱101'), f:col('康9')};
const row = (g,label)=>{
const grp=m.groups.find(x=>x.name===g);
if(label==='') return grp.rows.find(r=>r.header);
return grp.rows.find(r=>r.label===label);
};
const setCells=(r,arr)=>{arr.forEach(k=>{r.cells[C[k].id]=1;});};
const setTarget=(r,k,v)=>{r.targets[C[k].id]=v;};

setCells(row('TB','猫超'),     ['b','c','d','e']);
setCells(row('TB','签到'),     ['c','d','e','f']);
setCells(row('TB','签到元宝'), ['b','c','d','e','f']);
setCells(row('TB','成就'),     ['d','e','f']);
setTarget(row('TB','芭芭超值'),'d','20'); setTarget(row('TB','芭芭超值'),'e','20');

const jdHead = row('JD','');
setTarget(jdHead,'d','101'); setTarget(jdHead,'f','9');
setCells(row('JD','打卡'),   ['b','c','d','f']);
setCells(row('JD','水'),     ['b','c','d','f']);
setCells(row('JD','视频卡'), ['b','c','d','f']);
setCells(row('JD','家居馆'), ['b','c','d','f']);
setCells(row('JD','省钱卡'), ['b','c']);

setCells(row('电网','电网'), ['b']);
return m;
}

/* ==================== 工具 ==================== */
const STORE_KEY='checkin-tracker-mobile-v2'; 
function uid(){return Math.random().toString(36).slice(2,9);}
function deep(o){return JSON.parse(JSON.stringify(o));}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');
return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtDate(s){const [y,m,d]=s.split('-');return `${y}/${m}/${d}`;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function getDiffDays(dateStr1, dateStr2) {
    const d1 = new Date(dateStr1);
    const d2 = new Date(dateStr2);
    const diff = Math.abs(d2.getTime() - d1.getTime());
    return Math.floor(diff / (1000 * 60 * 60 * 24));
}

/* ==================== 状态 ==================== */
let state = load();
let draft = null; 
let currentView='today'; 

function load(){
try{
const raw=localStorage.getItem(STORE_KEY);
if(raw){
    const s=JSON.parse(raw);
    if(s&&s.master){
        if(!s.ledgers) s.ledgers = {};
        return s;
    }
}
}catch(e){}
const master=applyScreenshotDefaults(defaultMaster());
const initialLedgers = getDefaultLedgers();
return {master, days:{}, ledgers: initialLedgers};
}

function getDefaultLedgers() {
    return {
        '本5': [{ roundId: Date.now(), startDate: '', rows: [] }],
        '二乔6': [{ roundId: Date.now(), startDate: '', rows: [] }],
        '7爱101': [{ roundId: Date.now(), startDate: '', rows: [] }],
        '罗8': [{ roundId: Date.now(), startDate: '', rows: [] }],
        '康9': [{ roundId: Date.now(), startDate: '', rows: [] }]
    };
}

function save(){localStorage.setItem(STORE_KEY, JSON.stringify(state));}

function ensureToday(){
const t=todayStr();
if(!state.days[t]){
state.days[t]={master:deep(state.master), checks:{}, createdAt:Date.now()};
}
pruneDays();
save();
}
function pruneDays(){
const keys=Object.keys(state.days).sort().reverse();
keys.slice(3).forEach(k=>delete state.days[k]);
}
function todayDay(){ensureToday();return state.days[todayStr()];}

function totalChecks(m){
let n=0;
m.groups.forEach(g=>g.rows.forEach(r=>{n+=Object.keys(r.cells).length;}));
return n;
}
function doneChecks(day){
return Object.values(day.checks).filter(Boolean).length;
}

/* ==================== 渲染：今日打卡 ==================== */
function renderToday(){
const day=todayDay();
const m=day.master;
const total=totalChecks(m), done=doneChecks(day);
let html=`<div class="card">
<div class="meta-row">
<div class="date">今日打卡 · ${fmtDate(todayStr())}</div>
<div class="progress">已完成 <b>${done}</b> / ${total}</div>
</div>
<div class="sub-nav">
    <button class="btn nav-to-sub" data-target="master">打开母版</button>
    <button class="btn nav-to-sub" data-target="compare">历史打卡</button>
</div>

<div class="table-scroll"><table class="grid"><thead><tr>
<th class="col-label" style="width:22%">活动</th>`;
m.columns.forEach(c=>{html+=`<th class="tint-${c.tint}">${esc(c.name)}</th>`;});
html+=`</tr></thead><tbody>`;
m.groups.forEach(g=>{
html+=`<tr class="group"><td colspan="${m.columns.length+1}">${esc(g.name)}</td></tr>`;
g.rows.forEach(r=>{
if(r.header){
html+=`<tr><td class="label empty">—</td>`;
m.columns.forEach(c=>{
const t=r.targets[c.id];
html+=`<td class="tint-${c.tint}">${t?`<span class="cell-target">${esc(t)}</span>`:'<span class="empty">·</span>'}</td>`;
});
html+=`</tr>`;return;
}
html+=`<tr><td class="label">${esc(r.label)}</td>`;
m.columns.forEach(c=>{
const key=r.id+'_'+c.id;
if(r.cells[c.id]){
const on=day.checks[key]?1:0;
html+=`<td class="clickable tint-${c.tint}" data-key="${key}">
<div class="check ${on?'on':''}">${on?'✓':''}</div></td>`;
}else if(r.targets[c.id]){
html+=`<td class="tint-${c.tint}"><span class="cell-target">${esc(r.targets[c.id])}</span></td>`;
}else{
html+=`<td class="tint-${c.tint}"><span class="empty">·</span></td>`;
}
});
html+=`</tr>`;
});
});
html+=`</tbody></table></div></div>`;
document.getElementById('main').innerHTML=html;

document.querySelectorAll('#main td.clickable').forEach(td=>{
td.addEventListener('click',()=>{
const k=td.dataset.key;
day.checks[k]=!day.checks[k];
if(!day.checks[k]) delete day.checks[k];
save();renderToday();
});
});
}

/* ==================== 渲染：账号购买台账 ==================== */
function renderLedger() {
    let html = `<div class="card">
    <div class="meta-row">
        <div class="date">账号购买台账</div>
    </div>
    <div class="sub-nav">
        <button class="btn nav-to-sub" data-target="master">打开母版</button>
        <button class="btn nav-to-sub" data-target="compare">历史打卡</button>
    </div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:12px;">👉 提示：左右滑动查看其余账号。双击行切换高亮。</div>
    <div class="ledger-scroll-container">`;

    const ledgerCols = state.master.columns
        .filter(c => c.name !== '本5')
        .sort((a, b) => {
            const matchA = a.name.match(/\d+/);
            const matchB = b.name.match(/\d+/);
            let numA = matchA ? parseInt(matchA[0]) : 99;
            let numB = matchB ? parseInt(matchB[0]) : 99;
            if (numA === 99) {
                if (a.name.includes('二乔')) numA = 6;
                if (a.name.includes('爱')) numA = 7;
                if (a.name.includes('罗')) numA = 8;
                if (a.name.includes('康')) numA = 9;
            }
            if (numB === 99) {
                if (b.name.includes('二乔')) numB = 6;
                if (b.name.includes('爱')) numB = 7;
                if (b.name.includes('罗')) numB = 8;
                if (b.name.includes('康')) numB = 9;
            }
            return numA - numB;
        });

    ledgerCols.forEach(col => {
        if(!state.ledgers[col.name]) {
            state.ledgers[col.name] = [{ roundId: Date.now(), rows: [], startDate: '', currentDay: '' }];
        }
        const rounds = state.ledgers[col.name];

        let colTitle = col.name;
        if(!/\d/.test(colTitle)) {
            if(colTitle.includes('二乔')) colTitle = '6 | ' + colTitle;
            else if(colTitle.includes('爱')) colTitle = '7 | ' + colTitle;
            else if(colTitle.includes('罗')) colTitle = '8 | ' + colTitle;
            else if(colTitle.includes('康')) colTitle = '9 | ' + colTitle;
        }

        html += `<div class="ledger-card">
            <div class="ledger-head" title="${esc(col.name)}">${esc(colTitle)}</div>`;
            
        rounds.forEach((round, roundIdx) => {
            const isNewest = roundIdx === 0;
            
            let currentDayNum = '';
            if (round.startDate) {
                const match = round.startDate.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
                if (match) {
                    const m = parseInt(match[1]) - 1;
                    const d = parseInt(match[2]);
                    const today = new Date();
                    let year = today.getFullYear();
                    if (m > today.getMonth()) year--; 
                    const start = new Date(year, m, d);
                    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                    currentDayNum = diff >= 0 ? diff + 1 : 1;
                }
            }

            if (isNewest) {
                html += `<div class="ledger-meta">
                    <span>开启：<input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-f="startDate" value="${esc(round.startDate||'')}" placeholder="08/27"></span>
                    <span>天数：<b>${currentDayNum || '-'}</b></span>
                </div>`;
            } else {
                html += `<div class="history-block">`;
            }

            html += `<table class="ledger-table">
                <thead><tr>
                    <th style="width:14%">天数</th><th style="width:10%">限</th><th style="width:12%">低消</th><th style="width:40%">商品</th><th style="width:24%">实付</th>
                </tr></thead>
                <tbody>`;

            const rows = round.rows;
            // ⚠️ 这里改为至少 4 行，满足手机预览的轻量需求
            const totalRows = Math.max(4, rows.length);
            let sumActual = 0;

            for(let i=0; i<totalRows; i++) {
                const r = rows[i] || { day:'', countdown:'', countdownDate:'', minCost:'', product:'', actual:'' };
                const bgClass = r.isAchievement ? 'bg-yellow' : '';
                
                let displayCountdown = r.countdown;
                if (r.countdown !== '' && r.countdownDate) {
                    const diff = getDiffDays(r.countdownDate, todayStr());
                    if (diff > 0) {
                        displayCountdown = Number(r.countdown) - diff;
                    }
                }
                
                let countdownClass = '';
                if (displayCountdown !== '' && Number(displayCountdown) <= 1 && Number(displayCountdown) >= 0) {
                    countdownClass = 'countdown-warning';
                }

                if (r.actual && !isNaN(parseFloat(r.actual))) {
                    sumActual += parseFloat(r.actual);
                }

                html += `<tr class="${bgClass}" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" title="双击整行切换高亮">
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="day" value="${esc(r.day)}"></td>
                    <td><input type="text" class="${countdownClass}" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="countdown" value="${esc(displayCountdown)}" title="${r.countdownDate?'上次更新: '+r.countdownDate:''}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="minCost" value="${esc(r.minCost)}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="product" value="${esc(r.product)}"></td>
                    <td><input type="text" data-acc="${col.name}" data-round="${round.roundId}" data-row="${i}" data-f="actual" value="${esc(r.actual)}"></td>
                </tr>`;
            }

            html += `</tbody><tfoot>
                <tr class="sum-row">
                    <td colspan="4" style="text-align:right; padding-right:6px;">合计：</td>
                    <td style="color:#e53935;" class="sum-amount">${sumActual.toFixed(2)}</td>
                </tr>
            </tfoot></table>`;

            if (isNewest) {
                html += `<div style="margin-top:12px; text-align:center;">
                    <button class="btn small primary" data-new-round="${col.name}">结束本轮</button>
                </div>`;
            } else {
                html += `</div>`;
            }
        });
        html += `</div>`;
    });

    html += `</div></div>`;
    document.getElementById('main').innerHTML = html;
    bindLedgerEvents();
}

function bindLedgerEvents() {
    document.querySelectorAll('.ledger-card input').forEach(input => {
        input.addEventListener('input', (e) => {
            const accName = e.target.dataset.acc;
            const roundId = e.target.dataset.round;
            const rowIdx = e.target.dataset.row;
            const field = e.target.dataset.f;
            const val = e.target.value;

            if (!rowIdx && field === 'startDate') {
                const round = state.ledgers[accName].find(r => r.roundId == roundId);
                if (round) round[field] = val;
            } else if (rowIdx !== undefined) {
                const round = state.ledgers[accName].find(r => r.roundId == roundId);
                if (round) {
                    if (!round.rows[rowIdx]) round.rows[rowIdx] = {};
                    
                    if (field === 'countdown') {
                        round.rows[rowIdx].countdown = val;
                        round.rows[rowIdx].countdownDate = todayStr(); 
                    } else {
                        round.rows[rowIdx][field] = val;
                    }
                }
            }
            save();

            if (field === 'actual') {
                const table = e.target.closest('table');
                let sum = 0;
                table.querySelectorAll('input[data-f="actual"]').forEach(inp => {
                    const num = parseFloat(inp.value);
                    if (!isNaN(num)) sum += num;
                });
                const sumCell = table.querySelector('.sum-amount');
                if (sumCell) sumCell.textContent = sum.toFixed(2);
            }
        });
        
        if (input.dataset.f === 'startDate') {
            input.addEventListener('change', () => renderLedger());
        }
    });

    document.querySelectorAll('.ledger-table tbody tr').forEach(tr => {
        tr.addEventListener('dblclick', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            const accName = tr.dataset.acc;
            const roundId = tr.dataset.round;
            const rowIdx = tr.dataset.row;
            const round = state.ledgers[accName].find(r => r.roundId == roundId);
            if (round) {
                if (!round.rows[rowIdx]) round.rows[rowIdx] = {};
                round.rows[rowIdx].isAchievement = !round.rows[rowIdx].isAchievement;
                save();
                renderLedger();
            }
        });
    });

    document.querySelectorAll('[data-new-round]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const accName = e.target.dataset.newRound;
            if (confirm('确定结束本轮吗？完成后将在上方生成新一轮留白。')) {
                state.ledgers[accName].unshift({
                    roundId: Date.now(),
                    rows: [],
                    startDate: '',
                    currentDay: ''
                });
                save();
                renderLedger();
            }
        });
    });
}

/* ==================== 渲染：历史打卡 ==================== */
function renderCompare(){
let html = `<div class="card">
    <div class="meta-row">
        <div class="date">历史打卡</div>
        <button class="btn small back-to-today">← 返回</button>
    </div>`;
    
const keys=Object.keys(state.days).sort().reverse();
const recent=keys.slice(0,3); 
if(recent.length===0){document.getElementById('main').innerHTML=html+'<div class="note">暂无历史记录。</div></div>';return;}

html+=`<div class="note">仅保留最近 3 份记录。</div>`;
if(recent.length < 3) html+=`<div class="note" style="background:#f6f7f5;color:var(--muted)">目前只有 ${recent.length} 份记录。</div>`;
html+=`<div class="compare-wrap">`;
recent.forEach(k=>{
const day=state.days[k];const m=day.master;
html+=`<div class="compare-col"><h3>${fmtDate(k)}${k===todayStr()?'（今日）':''}</h3>
<div class="table-scroll"><table class="grid"><thead><tr><th class="col-label" style="width:22%">活动</th>`;
m.columns.forEach(c=>{html+=`<th class="tint-${c.tint}">${esc(c.name)}</th>`;});
html+=`</tr></thead><tbody>`;
m.groups.forEach(g=>{
html+=`<tr class="group"><td colspan="${m.columns.length+1}">${esc(g.name)}</td></tr>`;
g.rows.forEach(r=>{
html+=`<tr><td class="label">${r.header?'—':esc(r.label)}</td>`;
m.columns.forEach(c=>{
const key=r.id+'_'+c.id;
if(r.cells[c.id]){
const on=day.checks[key]?1:0;
html+=`<td class="tint-${c.tint}" data-day="${k}" data-key="${key}" data-on="${on}">
<div class="check ${on?'on':''}">${on?'✓':''}</div></td>`;
}else if(r.targets[c.id]){
html+=`<td class="tint-${c.tint}"><span class="cell-target">${esc(r.targets[c.id])}</span></td>`;
}else{html+=`<td class="tint-${c.tint}"><span class="empty">·</span></td>`;}
});
html+=`</tr>`;
});
});
html+=`</tbody></table></div></div>`;
});
html+=`</div></div>`;
document.getElementById('main').innerHTML=html;
}

/* ==================== 渲染：母版编辑 ==================== */
function renderMaster(){
if(!draft) draft=deep(state.master);
let html = `<div class="card">
    <div class="meta-row">
        <div class="date">母版编辑</div>
        <button class="btn small back-to-today">← 返回</button>
    </div>`;
html+=`<div class="note">在这里改活动项、账号列等。保存后明日生效。</div>`;

html+=`<div class="editor-section"><h2>账号列</h2><div class="col-cards">`;
draft.columns.forEach((c,ci)=>{
html+=`<div class="col-card">
<div class="row-line"><input type="text" data-col="${ci}" data-f="name" value="${esc(c.name)}" placeholder="列名"></div>
<div class="row-line">
<select data-col="${ci}" data-f="tint">
<option value="" ${!c.tint?'selected':''}>无底色</option>
<option value="pink" ${c.tint==='pink'?'selected':''}>粉底</option>
<option value="gray" ${c.tint==='gray'?'selected':''}>灰底</option>
</select>
<button class="btn small danger" data-del-col="${ci}">删</button>
</div></div>`;
});
html+=`</div><div style="margin-top:10px"><button class="btn small" data-add-col>＋ 添加账号列</button></div></div>`;

draft.groups.forEach((g,gi)=>{
html+=`<div class="group-block"><div class="group-head">
<input type="text" data-group="${gi}" data-f="name" value="${esc(g.name)}" placeholder="分组名">
<button class="btn small danger" data-del-group="${gi}">删分组</button>
</div>
<table class="edit-table"><thead><tr><th style="width:24%">活动项</th>`;
draft.columns.forEach(c=>{html+=`<th>${esc(c.name)}</th>`;});
html+=`</tr></thead><tbody>`;
g.rows.forEach((r,ri)=>{
html+=`<tr><td class="label">${r.header?'<span class="muted">标题行</span>':`<input type="text" data-row="${gi}" data-ri="${ri}" data-f="label" value="${esc(r.label)}">`}</td>`;
draft.columns.forEach((c,ci)=>{
const on=r.cells[c.id]?1:0;
const t=r.targets[c.id]||'';
html+=`<td><label class="switch"><input type="checkbox" data-cell="${gi}" data-ri="${ri}" data-ci="${ci}" ${on?'checked':''}></label>
<input class="num" type="text" inputmode="numeric" data-target="${gi}" data-ri="${ri}" data-ci="${ci}" value="${esc(t)}" placeholder="目标"></td>`;
});
html+=`</tr>`;
});
html+=`</tbody></table>
<div style="margin-top:8px"><button class="btn small" data-add-row="${gi}">＋ 添加活动项</button></div></div>`;
});

html+=`<div class="save-bar">
<button class="btn primary" data-save-master>保存母版</button>
<button class="btn" data-revert-draft>放弃</button>
</div></div>`;
document.getElementById('main').innerHTML=html;
bindMasterEvents();
}

function bindMasterEvents(){
const $=s=>document.querySelector(s);
document.querySelectorAll('[data-col]').forEach(el=>{
el.addEventListener('input',()=>{draft.columns[+el.dataset.col][el.dataset.f]=el.value;});
});
document.querySelectorAll('[data-group]').forEach(el=>{
el.addEventListener('input',()=>{draft.groups[+el.dataset.group][el.dataset.f]=el.value;});
});
document.querySelectorAll('[data-row]').forEach(el=>{
el.addEventListener('input',()=>{draft.groups[+el.dataset.row].rows[+el.dataset.ri].label=el.value;});
});
document.querySelectorAll('[data-cell]').forEach(el=>{
el.addEventListener('change',()=>{
const g=draft.groups[+el.dataset.cell],r=g.rows[+el.dataset.ri],c=draft.columns[+el.dataset.ci];
if(el.checked) r.cells[c.id]=1; else delete r.cells[c.id];
});
});
document.querySelectorAll('[data-target]').forEach(el=>{
el.addEventListener('input',()=>{
const g=draft.groups[+el.dataset.target],r=g.rows[+el.dataset.ri],c=draft.columns[+el.dataset.ci];
const v=el.value.trim();
if(v) r.targets[c.id]=v; else delete r.targets[c.id];
});
});
document.querySelector('[data-add-col]').addEventListener('click',()=>{
draft.columns.push({id:uid(),name:'新账号',tint:''});
renderMaster();
});
document.querySelectorAll('[data-del-col]').forEach(b=>b.addEventListener('click',()=>{
const ci=+b.dataset.delCol;const cid=draft.columns[ci].id;
draft.columns.splice(ci,1);
draft.groups.forEach(g=>g.rows.forEach(r=>{delete r.cells[cid];delete r.targets[cid];}));
renderMaster();
}));
document.querySelectorAll('[data-add-row]').forEach(b=>b.addEventListener('click',()=>{
draft.groups[+b.dataset.addRow].rows.push({id:uid(),label:'新活动',targets:{},cells:{}});
renderMaster();
}));
document.querySelectorAll('[data-del-group]').forEach(b=>b.addEventListener('click',()=>{
if(!confirm('删除该分组及其活动项？'))return;
draft.groups.splice(+b.dataset.delGroup,1);renderMaster();
}));
document.querySelector('[data-revert-draft]').addEventListener('click',()=>{draft=null;renderMaster();});
document.querySelector('[data-save-master]').addEventListener('click',saveMaster);
}

function saveMaster(){
if(draft.groups.length===0){toast('至少保留一个分组');return;}
draft.groups.forEach(g=>g.rows.forEach(r=>{
Object.keys(r.cells).forEach(k=>{if(!draft.columns.find(c=>c.id===k))delete r.cells[k];});
Object.keys(r.targets).forEach(k=>{if(!draft.columns.find(c=>c.id===k))delete r.targets[k];});
}));
state.master=deep(draft);
const t=todayStr();
if(state.days[t] && doneChecks(state.days[t])===0){
state.days[t]={master:deep(state.master),checks:{},createdAt:Date.now()};
toast('母版已保存');
}else{
toast('母版已保存，明日生效');
}
pruneDays();save();draft=null;renderMaster();
}

/* ==================== 备份 ==================== */
function exportBackup(){
const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download=`周末打卡备份-${todayStr()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importBackup(file){
const reader=new FileReader();
reader.onload=()=>{
try{
const s=JSON.parse(reader.result);
if(!s||!s.master)throw new Error('bad');
state=s;pruneDays();save();draft=null;ensureToday();render();
toast('备份已导入');
}catch(e){toast('文件无效');}
};
reader.readAsText(file);
}

/* ==================== 路由 ==================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function render(){
    ensureToday();
    
    document.querySelectorAll('nav.tabs button').forEach(x => x.classList.remove('active'));
    let activeTab = 'today';
    if (currentView === 'ledger') {
        activeTab = 'ledger';
    } else if (['master', 'compare'].includes(currentView)) {
        activeTab = 'today'; 
    }
    const tabBtn = document.querySelector(`nav.tabs button[data-view="${activeTab}"]`);
    if(tabBtn) tabBtn.classList.add('active');

    if(currentView === 'today') renderToday();
    else if(currentView === 'ledger') renderLedger();
    else if(currentView === 'master') renderMaster();
    else if(currentView === 'compare') renderCompare();
}

document.querySelectorAll('nav.tabs button').forEach(b => {
    b.addEventListener('click', () => {
        currentView = b.dataset.view;
        render();
    });
});

document.getElementById('main').addEventListener('click', e => {
    const subNavBtn = e.target.closest('.nav-to-sub');
    if (subNavBtn) {
        currentView = subNavBtn.dataset.target;
        render();
        return;
    }
    if (e.target.closest('.back-to-today')) {
        currentView = 'today';
        render();
        return;
    }
});

document.getElementById('btn-export').addEventListener('click',exportBackup);
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change',e=>{
if(e.target.files[0])importBackup(e.target.files[0]);e.target.value='';
});

render();
</script></body>
</html>
